name: Build Apple clients
on:
  workflow_dispatch:
  push:
    branches: [codex/lunar-clients]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: npm run desktop -- --target universal-apple-darwin --bundles dmg
      - name: Launch the universal app
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Yueying.app"
          binary="$app/Contents/MacOS/yueying"
          lipo -verify_arch arm64 x86_64 "$binary"
          "$binary" &
          app_pid=$!
          sleep 5
          kill -0 "$app_pid"
          kill "$app_pid"
      - uses: actions/upload-artifact@v4
        with:
          name: Yueying-macOS
          path: web/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ios
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Launch on an iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/Build/Products/Release-iphonesimulator/App.app
          xcrun simctl launch "$device" app.yueying.watch
          sleep 5
          xcrun simctl io "$device" screenshot Yueying-iPhone.png
      - run: ditto -c -k --keepParent build/Build/Products/Release-iphonesimulator/App.app Yueying-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Yueying-iOS-Simulator
          path: |
            web/Yueying-iOS-Simulator.zip
            web/Yueying-iPhone.png
